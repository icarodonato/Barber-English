
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Barber English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  /* Layout: one phone-first column. Barber-pole band on top, signage-style condensed headings, plain white cards.
     Red = the action to take. Blue = progress and pronunciation. Green/dark red only for right/wrong answers. */
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#111C29; --muted:#566475; --line:#D6DDE5;
  --red:#C62F2A; --on-red:#FFFFFF;
  --blue:#1B4E9B; --blue-soft:#E4EDFA;
  --good:#1D7448; --good-soft:#E1F2E8;
  --bad:#AE2A22; --bad-soft:#FBE7E4;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#161E28; --ink:#E9EEF4; --muted:#9AA7B6; --line:#2A3543;
    --red:#FF7A6B; --on-red:#1A0B0A;
    --blue:#82AEF2; --blue-soft:#1A2A44;
    --good:#5CCB93; --good-soft:#15301F;
    --bad:#FF8D82; --bad-soft:#3B1F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E28; --ink:#E9EEF4; --muted:#9AA7B6; --line:#2A3543;
  --red:#FF7A6B; --on-red:#1A0B0A;
  --blue:#82AEF2; --blue-soft:#1A2A44;
  --good:#5CCB93; --good-soft:#15301F;
  --bad:#FF8D82; --bad-soft:#3B1F1D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.5 var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.pole{height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--surface) 10px 20px,var(--blue) 20px 30px,var(--surface) 30px 40px);border:1px solid var(--line)}
.label{margin:0;font:600 12px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
h1{font-size:clamp(52px,15vw,76px);line-height:.92;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:30px;line-height:1.05;font-weight:700}
h3{font-size:24px;line-height:1.1;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:46ch}
.hero{display:flex;flex-direction:column;gap:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat strong{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stat strong small{font-size:20px;color:var(--muted);font-weight:600}
.bar{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}

.daily{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;width:100%;background:var(--red);color:var(--on-red);border:0;border-radius:6px;padding:18px 18px}
.daily .label{color:inherit;opacity:.85}
.daily strong{font:700 30px/1.05 var(--display)}
.daily span.sub{grid-column:1;font-size:15px;opacity:.9}
.daily .ic{grid-column:2;grid-row:1 / span 3;display:flex}

.section{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-height:64px}
.row:hover{border-color:var(--blue)}
.row-main{display:flex;flex-direction:column;min-width:0}
.row-title{font:700 24px/1.1 var(--display)}
.row-sub{font-size:14px;color:var(--muted)}
.row-end{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.row .bar{grid-column:1 / -1}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}

.topbar{display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 8px 8px 0;color:var(--blue);font-weight:600;min-height:44px}
.sub{color:var(--muted);font-size:15px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:12px 8px;min-height:48px;font-weight:600;letter-spacing:.03em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E141B}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E141B}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.flash-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.en{font:700 clamp(32px,9vw,44px)/1.05 var(--display);text-wrap:balance}
.pt{font-size:20px;font-weight:500}
.say{font:500 16px/1.5 var(--mono);color:var(--blue);overflow-wrap:anywhere}
.reveal{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.tip{font-size:14px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 8px;border-radius:999px}
.tag.good{background:var(--good-soft);color:var(--good)}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.audio-btn{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;min-height:54px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right svg{color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong svg{color:var(--bad)}
.opt.dim{opacity:.55}
.sq{min-width:54px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.feedback{border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback strong{font:700 22px/1.1 var(--display)}
.progress-line{display:flex;align-items:center;gap:12px}
.progress-line .bar{flex:1}

.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.bubble.me{align-self:flex-end;background:var(--blue-soft);border-color:var(--blue-soft)}
.bubble .who{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bubble.me .who{color:var(--blue)}
.bubble .line{font:600 22px/1.2 var(--display);letter-spacing:.005em}
.bubble .tr{font-size:15px;color:var(--muted)}
.situation{font-size:15px;color:var(--muted);border-left:3px solid var(--red);padding-left:12px}
.score{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.miss li{border-top:1px solid var(--line);padding-top:8px}
.miss b{font-family:var(--display);font-size:20px}
.empty{align-items:flex-start}
.wrap.flush{padding-block:0}
.icw{display:inline-flex}
svg{flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

/* ---------- Preparação dos dados ---------- */
var MOD={};
MODULES.forEach(function(m){
  m.cards=m.cards.map(function(a){
    return {id:m.id+':'+a[0].toLowerCase().replace(/[^a-z0-9]+/g,'-'),en:a[0],pt:a[1],say:a[2],mod:m.id,kind:m.kind||'phrase'};
  });
  MOD[m.id]=m;
});
function allCards(){var r=[];MODULES.forEach(function(m){r=r.concat(m.cards);});return r;}

/* ---------- Progresso salvo no navegador ---------- */
var KEY='barber-english-v1';
function loadP(){
  var base={known:{},days:[],scenes:{},slow:false};
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==='object'){return Object.assign(base,o);}}}catch(e){}
  return base;
}
var P=loadP();
function saveP(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function markDay(){
  var t=ds(new Date());
  if(P.days.indexOf(t)<0){P.days.push(t);if(P.days.length>400){P.days=P.days.slice(-400);}}
  saveP();
}
function streak(){
  var set={};P.days.forEach(function(d){set[d]=1;});
  var d=new Date();if(!set[ds(d)]){d.setDate(d.getDate()-1);}
  var s=0;while(set[ds(d)]){s++;d.setDate(d.getDate()-1);}
  return s;
}
function setKnown(id,v){if(v){P.known[id]=1;}else{delete P.known[id];}markDay();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- Áudio ---------- */
var TTS=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
var voice=null;
function loadVoice(){
  if(!TTS){return;}
  try{
    var vs=speechSynthesis.getVoices()||[];
    function L(v){return String(v.lang||'').replace('_','-');}
    voice=vs.filter(function(v){return L(v)==='en-IE';})[0]||vs.filter(function(v){return L(v)==='en-GB';})[0]||vs.filter(function(v){return /^en/i.test(L(v));})[0]||null;
  }catch(e){voice=null;}
}
if(TTS){loadVoice();try{speechSynthesis.addEventListener('voiceschanged',loadVoice);}catch(e){}}
function speak(t){
  if(!TTS){return;}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=voice?String(voice.lang).replace('_','-'):'en-GB';
    if(voice){u.voice=voice;}
    u.rate=P.slow?0.6:0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Ajudantes de interface ---------- */
function el(tag,props){
  var n=document.createElement(tag);
  if(props){for(var k in props){
    var v=props[k];
    if(v===null||v===undefined||v===false){continue;}
    if(k==='class'){n.className=v;}
    else if(k.slice(0,2)==='on'){n.addEventListener(k.slice(2),v);}
    else{n.setAttribute(k,v===true?'':v);}
  }}
  for(var i=2;i<arguments.length;i++){add(n,arguments[i]);}
  return n;
}
function add(n,c){
  if(c===null||c===undefined||c===false){return;}
  if(Array.isArray(c)){c.forEach(function(x){add(n,x);});return;}
  n.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));
}
function icon(path,size){
  var s=el('span',{'aria-hidden':'true',class:'icw'});
  s.innerHTML='<svg viewBox="0 0 24 24" width="'+(size||20)+'" height="'+(size||20)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
  return s;
}

  spk:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',

};
function bar(pct){var i=el('i');i.style.width=Math.max(0,Math.min(100,pct))+'%';return el('span',{class:'bar'},i);}
function btn(label,cls,fn,extra){return el('button',Object.assign({class:'btn '+(cls||''),type:'button',onclick:fn},extra||{}),label);}
function seg(items){
  return el('div',{class:'seg',role:'group'},items.map(function(it){
    return el('button',{type:'button','aria-pressed':it.on?'true':'false',onclick:it.fn},it.label);
  }));
}
function audioRow(text){
  if(!TTS){return el('p',{class:'tip'},'Este navegador não tem áudio. Leia em voz alta.');}
  return el('div',{class:'audio'},
    el('button',{class:'btn audio-btn',type:'button',onclick:function(){speak(text);}},icon(I.spk),'Ouvir'),
    el('button',{class:'chip',type:'button','aria-pressed':P.slow?'true':'false',onclick:function(){P.slow=!P.slow;saveP();render();speak(text);}},'Devagar')
  );
}
function topbar(title,sub,onBack,backLabel){
  return el('div',{class:'topbar'},
    el('button',{class:'back',type:'button',onclick:onBack},icon(I.back),backLabel||'Início'),
    el('h2',null,title),
    sub?el('p',{class:'sub'},sub):null
  );
}

/* ---------- Estado e navegação ---------- */
var state={view:'home',mod:null,tab:'cards',filter:'all',idx:0,rev:false,quiz:null,scene:null};
var root=document.getElementById('app');
function render(){
  var v;
  if(state.view==='module'){v=viewModule();}
  else if(state.view==='daily'){v=viewDaily();}
  else if(state.view==='scene'){v=viewScene();}
  else if(state.view==='track'){v=viewTrack();}
  else{v=viewHome();}
  root.replaceChildren(v);
}
function go(view,extra){
  if(TTS){try{speechSynthesis.cancel();}catch(e){}}
  Object.assign(state,extra||{});
  state.view=view;
  render();
  try{window.scrollTo(0,0);}catch(e){}
}

/* ---------- Início ---------- */
function trackOf(x){return x.group||'barbearia';}
function trackTitle(id){return TRACKS.filter(function(t){return t.id===id;})[0].title;}
function trackRows(){
  return TRACKS.map(function(t){
    var mods=MODULES.filter(function(m){return trackOf(m)===t.id;});
    var total=0,k=0;
    mods.forEach(function(m){total+=m.cards.length;m.cards.forEach(function(c){if(P.known[c.id]){k++;}});});
    var sc=SCENES.filter(function(x){return trackOf(x)===t.id;}).length;
    return el('button',{class:'row',type:'button',onclick:function(){go('track',{track:t.id});}},
      el('span',{class:'row-main'},el('span',{class:'row-title'},t.title),el('span',{class:'row-sub'},t.blurb+' ('+mods.length+(mods.length===1?' módulo':' módulos')+', '+sc+(sc===1?' simulação':' simulações')+')')),
      el('span',{class:'row-end'},k+'/'+total,icon(I.chev)),
      bar(total?k/total*100:0)
    );
  });
}
function viewTrack(){
  var t=TRACKS.filter(function(x){return x.id===state.track;})[0];
  var sr=sceneRows(t.id),mr=modRows(t.id);
  return el('div',{class:'wrap'},
    topbar(t.title,t.blurb,function(){go('home');}),
    sr.length?section('Simulações de conversa',sr):null,
    mr.length?section('Frases e palavras',mr):null
  );
}
function sceneRows(g){
  return SCENES.filter(function(sc){return (sc.group||'barbearia')===g;}).map(function(sc){
    var best=P.scenes[sc.id];
    return el('button',{class:'row',type:'button',onclick:function(){startScene(sc.id);}},
      el('span',{class:'row-main'},el('span',{class:'row-title'},sc.title),el('span',{class:'row-sub'},sc.blurb)),
      el('span',{class:'row-end'},best!==undefined?(best+'/'+sc.steps.length):'',icon(I.chev))
    );
  });
}
function modRows(g){
  return MODULES.filter(function(m){return (m.group||'barbearia')===g;}).map(function(m){
    var k=m.cards.filter(function(c){return P.known[c.id];}).length;
    return el('button',{class:'row',type:'button',onclick:function(){go('module',{mod:m.id,tab:'cards',filter:'all',idx:0,rev:false,quiz:null});}},
      el('span',{class:'row-main'},el('span',{class:'row-title'},m.title),el('span',{class:'row-sub'},m.en)),
      el('span',{class:'row-end'},k+'/'+m.cards.length,icon(I.chev)),
      bar(k/m.cards.length*100)
    );
  });
}
function section(label,rows){
  return el('section',{class:'section'},el('p',{class:'label'},label),el('div',{class:'list'},rows));
}
function viewHome(){
  var all=allCards();
  var known=all.filter(function(c){return P.known[c.id];}).length;
  var s=streak();
  return el('div',{class:'wrap'},
    el('div',{class:'pole','aria-hidden':'true'}),
    el('header',{class:'hero'},
      el('p',{class:'label'},'Inglês para a barbearia e para a vida na Irlanda'),
      el('h1',null,'Barber English'),
      el('p',{class:'lead'},'Ouça, repita em voz alta e responda. Frases reais de atendimento e de conversa para quem está começando no inglês.')
    ),
    el('div',{class:'stats'},
      el('div',{class:'stat'},el('span',{class:'label'},'Frases aprendidas'),el('strong',null,String(known),el('small',null,' / '+all.length)),bar(known/all.length*100)),
      el('div',{class:'stat'},el('span',{class:'label'},'Sequência de estudo'),el('strong',null,String(s),el('small',null,s===1?' dia':' dias')),el('span',{class:'tip'},s?'Estude hoje para manter.':'Faça o treino de hoje para começar.'))
    ),
    el('button',{class:'daily',type:'button',onclick:startDaily},
      el('span',{class:'label'},'Treino do dia'),
      el('strong',null,'10 perguntas misturadas'),
      el('span',{class:'sub'},'Começa pelo que você ainda não sabe. Leva uns 3 minutos.'),
      el('span',{class:'ic'},icon(I.arrow,28))
    ),
    section('Trilhas de estudo',trackRows()),
    el('section',{class:'section'},
      el('p',{class:'label'},'Em breve'),
      el('div',{class:'soon'},SOON.map(function(t){return el('span',null,t);}))
    )
  );
}

/* ---------- Módulo: cartões e quiz ---------- */
function viewModule(){
  var m=MOD[state.mod];
  return el('div',{class:'wrap'},
    topbar(m.title,m.blurb,function(){go('track',{track:trackOf(m)});},trackTitle(trackOf(m))),
    seg([
      {label:'Cartões',on:state.tab==='cards',fn:function(){state.tab='cards';render();}},
      {label:'Quiz',on:state.tab==='quiz',fn:function(){
        state.tab='quiz';
        if(!state.quiz||state.quiz.scope!==m.id){state.quiz=newQuiz(m.id,m.cards,Math.min(8,m.cards.length),m.cards);}
        render();speakIfListen();
      }}
    ]),
    state.tab==='cards'?cardsBody(m):quizBody(m.title)
  );
}
function cardsBody(m){
  var review=m.cards.filter(function(c){return !P.known[c.id];});
  var deck=state.filter==='review'?review:m.cards;
  var filter=seg([
    {label:'Todos ('+m.cards.length+')',on:state.filter==='all',fn:function(){state.filter='all';state.idx=0;state.rev=false;render();}},
    {label:'Revisar ('+review.length+')',on:state.filter==='review',fn:function(){state.filter='review';state.idx=0;state.rev=false;render();}}
  ]);
  if(!deck.length){
    return el('div',{class:'wrap flush'},filter,
      el('div',{class:'panel empty'},
        el('h3',null,'Tudo aprendido aqui'),
        el('p',null,'Você marcou todas as frases deste módulo como aprendidas. Faça o quiz para confirmar.'),
        btn('Fazer o quiz','primary',function(){
          state.tab='quiz';state.quiz=newQuiz(m.id,m.cards,Math.min(8,m.cards.length),m.cards);render();speakIfListen();
        })
      ));
  }
  if(state.idx>=deck.length){state.idx=deck.length-1;}
  if(state.idx<0){state.idx=0;}
  var c=deck[state.idx];
  function advance(){state.rev=false;if(state.idx<deck.length-1){state.idx++;}else{state.idx=0;}}
  var done=!!P.known[c.id];
  return el('div',{class:'wrap flush'},
    filter,
    el('article',{class:'panel'},
      el('div',{class:'flash-top'},
        el('span',{class:'label'},(state.idx+1)+' de '+deck.length),
        done?el('span',{class:'tag good'},icon(I.check,14),'Aprendida'):null
      ),
      el('p',{class:'en',lang:'en'},c.en),
      audioRow(c.en),
      state.rev
        ?el('div',{class:'reveal'},
            el('p',{class:'pt'},c.pt),
            el('p',{class:'label'},'Como falar (aproximado)'),
            el('p',{class:'say'},c.say),
            el('p',{class:'tip'},'Repita em voz alta três vezes.'))
        :btn('Mostrar tradução','ghost wide',function(){state.rev=true;render();}),
      state.rev?el('div',{class:'actions'},
        btn('Revisar depois','',function(){setKnown(c.id,false);advance();render();}),
        btn('Já sei','primary',function(){setKnown(c.id,true);advance();render();})
      ):null
    ),
    el('div',{class:'nav'},
      btn('Anterior','',function(){state.rev=false;state.idx=state.idx>0?state.idx-1:deck.length-1;render();}),
      btn('Próxima','',function(){advance();render();})
    )
  );
}

/* ---------- Quiz (usado no módulo e no treino do dia) ---------- */
function newQuiz(scope,cards,n,pool){
  var unk=shuffle(cards.filter(function(c){return !P.known[c.id];}));
  var kn=shuffle(cards.filter(function(c){return P.known[c.id];}));
  var chosen=shuffle(unk.concat(kn).slice(0,n));
  var types=TTS?['en2pt','pt2en','listen']:['en2pt','pt2en'];
  var qs=chosen.map(function(c){
    var type=types[Math.floor(Math.random()*types.length)];
    var key=type==='pt2en'?'en':'pt';
    var ans=c[key];
    var opts=[ans],seen={};seen[ans]=1;
    shuffle(pool.filter(function(x){return x.id!==c.id&&x.kind===c.kind;})).forEach(function(x){
      if(opts.length<4&&!seen[x[key]]){seen[x[key]]=1;opts.push(x[key]);}
    });
    return {c:c,type:type,ans:ans,opts:shuffle(opts),picked:null};
  });
  return {scope:scope,qs:qs,i:0,score:0};
}
function speakIfListen(){
  var Q=state.quiz;
  if(!Q||Q.i>=Q.qs.length){return;}
  var q=Q.qs[Q.i];
  if(q.type==='listen'&&q.picked===null){speak(q.c.en);}
}
function answerQ(o){
  var Q=state.quiz,q=Q.qs[Q.i];
  if(q.picked!==null){return;}
  q.picked=o;
  if(o===q.ans){Q.score++;setKnown(q.c.id,true);}else{setKnown(q.c.id,false);}
  render();
}
function quizBody(title){
  var Q=state.quiz;
  if(!Q.qs.length){return el('div',{class:'panel'},el('p',null,'Não há perguntas aqui ainda.'));}
  if(Q.i>=Q.qs.length){return quizResult(Q);}
  var q=Q.qs[Q.i];
  var answered=q.picked!==null;
  var right=q.picked===q.ans;
  var head=q.type==='en2pt'?'Qual é o significado?':q.type==='pt2en'?'Como se diz em inglês?':'Ouça e escolha o significado';
  return el('div',{class:'wrap flush'},
    el('div',{class:'progress-line'},el('span',{class:'label'},'Pergunta '+(Q.i+1)+' de '+Q.qs.length),bar(Q.i/Q.qs.length*100)),
    el('article',{class:'panel'},
      el('p',{class:'label'},head),
      q.type==='en2pt'?el('p',{class:'en',lang:'en'},q.c.en):null,
      q.type==='pt2en'?el('p',{class:'en'},q.c.pt):null,
      q.type!=='pt2en'?audioRow(q.c.en):null,
      el('div',{class:'opts'},q.opts.map(function(o){
        var cls='opt',ic=null;
        if(answered){
          if(o===q.ans){cls+=' right';ic=icon(I.check);}
          else if(o===q.picked){cls+=' wrong';ic=icon(I.cross);}
          else{cls+=' dim';}
        }
        var attrs={class:cls,type:'button',onclick:function(){answerQ(o);}};
        if(answered){attrs.disabled=true;}
        if(q.type==='pt2en'){attrs.lang='en';}
        return el('button',attrs,el('span',null,o),ic);
      })),
      answered?el('div',{class:'feedback '+(right?'ok':'no')},
        el('strong',null,right?'Certo!':'Quase. A resposta certa está em verde.'),
        el('p',{lang:'en'},q.c.en),
        el('p',null,q.c.pt),
        el('p',{class:'say'},q.c.say)
      ):null,
      answered?btn(Q.i+1>=Q.qs.length?'Ver resultado':'Próxima','primary wide',function(){Q.i++;render();speakIfListen();}):null
    )
  );
}
function quizResult(Q){
  var n=Q.qs.length;
  var missed=Q.qs.filter(function(q){return q.picked!==q.ans;});
  var msg=Q.score===n?'Perfeito. Tudo certo.':Q.score>=n*0.7?'Muito bom. Revise o que errou abaixo.':'Bom começo. Volte aos cartões e tente de novo.';
  return el('div',{class:'wrap flush'},
    el('article',{class:'panel'},
      el('p',{class:'label'},'Resultado'),
      el('p',{class:'score'},Q.score+'/'+n),
      el('p',null,msg),
      missed.length?el('div',null,
        el('p',{class:'label'},'Para revisar'),
        el('ul',{class:'miss'},missed.map(function(q){
          return el('li',null,el('b',{lang:'en'},q.c.en),el('p',null,q.c.pt));
        }))
      ):null,
      el('div',{class:'actions'},
        btn('Início','',function(){go('home');}),
        btn('Refazer','primary',function(){
          var pool=Q.scope==='daily'?allCards():MOD[Q.scope].cards;
          state.quiz=newQuiz(Q.scope,pool,Q.scope==='daily'?10:Math.min(8,pool.length),pool);
          render();speakIfListen();
        })
      )
    )
  );
}
function startDaily(){
  var pool=allCards();
  state.quiz=newQuiz('daily',pool,10,pool);
  go('daily');
  speakIfListen();
}
function viewDaily(){
  return el('div',{class:'wrap'},
    topbar('Treino do dia','Perguntas misturadas de todos os módulos.',function(){go('home');}),
    quizBody('Treino do dia')
  );
}

/* ---------- Simulações ---------- */
function beginStep(S){
  var sc=SCENES.filter(function(x){return x.id===S.id;})[0];
  S.order=shuffle(sc.steps[S.i].o.map(function(_,k){return k;}));
  S.tries=0;S.wrong=[];S.ok=false;S.msg=null;S.pt=false;S.picked=-1;
}
function startScene(id){
  var S={id:id,i:0,first:0,done:false,log:[]};
  beginStep(S);
  state.scene=S;
  go('scene');
}
function pickOpt(k){
  var S=state.scene;
  var sc=SCENES.filter(function(x){return x.id===S.id;})[0];
  var o=sc.steps[S.i].o[k];
  if(S.ok){return;}
  markDay();
  if(o.ok){S.ok=true;S.picked=k;S.msg=o.w;if(S.tries===0){S.first++;}}
  else{if(S.wrong.indexOf(k)<0){S.wrong.push(k);}S.tries++;S.msg=o.w;}
  render();
}
function nextStep(){
  var S=state.scene;
  var sc=SCENES.filter(function(x){return x.id===S.id;})[0];
  var st=sc.steps[S.i];
  S.log.push({c:st.c,cp:st.cp,r:st.o[S.picked].t});
  S.i++;
  if(S.i>=sc.steps.length){
    S.done=true;
    P.scenes[S.id]=Math.max(P.scenes[S.id]||0,S.first);
    saveP();
  }else{beginStep(S);}
  render();
}
function viewScene(){
  var S=state.scene;
  var sc=SCENES.filter(function(x){return x.id===S.id;})[0];
  var total=sc.steps.length;
  var chat=el('div',{class:'chat'});
  S.log.forEach(function(l){
    chat.appendChild(el('div',{class:'bubble'},el('span',{class:'who'},'Cliente'),el('p',{class:'line',lang:'en'},l.c)));
    chat.appendChild(el('div',{class:'bubble me'},el('span',{class:'who'},'Você'),el('p',{class:'line',lang:'en'},l.r)));
  });
  if(S.done){
    var msg=S.first===total?'Perfeito. Todas de primeira.':S.first>=total-1?'Muito bom. Quase tudo de primeira.':'Boa. Repita a simulação para acertar de primeira.';
    return el('div',{class:'wrap'},
      topbar(sc.title,null,function(){go('track',{track:trackOf(sc)});},trackTitle(trackOf(sc))),
      chat,
      el('article',{class:'panel'},
        el('p',{class:'label'},'Simulação completa'),
        el('p',{class:'score'},S.first+'/'+total),
        el('p',null,msg+' O número mostra as respostas certas na primeira tentativa.'),
        el('div',{class:'actions'},
          btn('Voltar à trilha','',function(){go('track',{track:trackOf(sc)});}),
          btn('Repetir','primary',function(){startScene(S.id);})
        )
      )
    );
  }
  var st=sc.steps[S.i];
  var cust=el('div',{class:'bubble'},
    el('span',{class:'who'},'Cliente'),
    el('p',{class:'line',lang:'en'},st.c),
    S.pt?el('p',{class:'tr'},st.cp):null,
    el('div',{class:'audio'},
      TTS?el('button',{class:'btn audio-btn',type:'button',onclick:function(){speak(st.c);}},icon(I.spk),'Ouvir'):null,
      el('button',{class:'chip',type:'button','aria-pressed':S.pt?'true':'false',onclick:function(){S.pt=!S.pt;render();}},'Ver tradução')
    )
  );
  var opts=el('div',{class:'opts'},S.order.map(function(k){
    var o=st.o[k];
    var cls='opt',ic=null,attrs={type:'button',lang:'en'};
    if(S.ok){
      if(k===S.picked){cls+=' right';ic=icon(I.check);}else{cls+=' dim';}
      attrs.disabled=true;
    }else if(S.wrong.indexOf(k)>=0){cls+=' wrong';ic=icon(I.cross);attrs.disabled=true;}
    attrs.class=cls;
    attrs.onclick=function(){pickOpt(k);};
    var main=el('button',attrs,el('span',null,o.t),ic);
    if(!TTS){return main;}
    return el('div',{class:'optrow'},main,el('button',{class:'sq',type:'button','aria-label':'Ouvir esta resposta',onclick:function(){speak(o.t);}},icon(I.spk)));
  }));
  var fb=null;
  if(S.msg){
    fb=el('div',{class:'feedback '+(S.ok?'ok':'no')},
      el('strong',null,S.ok?'Boa resposta':'Tente outra'),
      el('p',null,S.msg));
  }
  return el('div',{class:'wrap'},
    topbar(sc.title,null,function(){go('track',{track:trackOf(sc)});},trackTitle(trackOf(sc))),
    el('div',{class:'progress-line'},el('span',{class:'label'},'Fala '+(S.i+1)+' de '+total),bar(S.i/total*100)),
    chat,
    el('p',{class:'situation'},st.sit),
    cust,
    el('p',{class:'label'},'Sua resposta'),
    opts,
    fb,
    S.ok?btn(S.i+1>=total?'Ver resultado':'Próxima fala','primary wide',nextStep):null
  );
}

render();
})();
</script>
